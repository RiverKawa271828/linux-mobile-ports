%YAML 1.2
---
$id: http://devicetree.org/schemas/input/awinic,aw8697.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW8697 LRA Haptic IC

maintainers:
  - postmarketOS meizu20 port

properties:
  compatible:
    const: awinic,aw8697

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - reset-gpios
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        vibrator@5a {
            compatible = "awinic,aw8697";
            reg = <0x5a>;
            interrupts-extended = <&tlmm 99 IRQ_TYPE_LEVEL_HIGH>;
            reset-gpios = <&tlmm 109 GPIO_ACTIVE_LOW>;
        };
    };
